services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_sim
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  main-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_HTTP_PORT: 8080
      MARKET_DATA_SERVICE_URL: http://market-data-service:8080
      NEWS_FEED_SERVICE_URL: http://news-feed-service:8080
    ports:
      - "8080:8080"

  market-data-service:
    build:
      context: .
      dockerfile: market-data-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_SERVICE_URL: http://main-api:8080/api/logs
      QUESTRADE_API_KEY: ${QUESTRADE_API_KEY:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
    ports:
      - "8081:8080"

  news-feed-service:
    build:
      context: ./news-feed-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_SERVICE_URL: http://main-api:8080/api/logs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "8082:8080"

  analyst-service:
    build:
      context: ./analyst-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_SERVICE_URL: http://main-api:8080/api/logs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8083:8080"

volumes:
  postgres_data:
