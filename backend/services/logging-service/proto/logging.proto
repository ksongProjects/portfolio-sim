syntax = "proto3";

package logging;

option go_package = "github.com/portfolio-sim/backend/services/logging-service/proto";

service LoggingService {
  rpc EmitLog(EmitLogRequest) returns (EmitLogResponse);
}

message EmitLogRequest {
  string level = 1;
  string service = 2;
  string component = 3;
  string message = 4;
  map<string, string> metadata = 5;
  string trace_id = 6;
  string span_id = 7;
}

message EmitLogResponse {
  string id = 1;
  string timestamp = 2;
}