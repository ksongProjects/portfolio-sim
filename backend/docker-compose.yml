services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_sim
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  logging-service:
    build:
      context: ${PWD}/backend
      dockerfile: services/logging-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_GRPC_PORT: 50051
    ports:
      - "50051:50051"

  main-api:
    build:
      context: ${PWD}/backend
      dockerfile: services/main-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      logging-service:
        condition: service_started
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_HTTP_PORT: 8080
      SERVER_GRPC_PORT: 50051
    ports:
      - "8080:8080"

  market-data-service:
    build:
      context: ${PWD}/backend
      dockerfile: services/market-data-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      logging-service:
        condition: service_started
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUESTRADE_API_KEY: ${QUESTRADE_API_KEY:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
    ports:
      - "8081:8080"

  news-feed-service:
    build:
      context: ${PWD}/backend
      dockerfile: services/news-feed-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      logging-service:
        condition: service_started
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "8082:8080"

  analyst-service:
    build:
      context: ${PWD}/backend
      dockerfile: services/analyst-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: portfolio_sim
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8083:8080"

volumes:
  postgres_data:
