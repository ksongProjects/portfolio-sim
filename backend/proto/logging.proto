syntax = "proto3";

package logging;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/portfolio-sim/backend/proto/logging";

service LoggingService {
    rpc EmitLog(EmitLogRequest) returns (EmitLogResponse);
    rpc StreamLogs(StreamLogsRequest) returns (stream LogEntry);
}

message LogEntry {
    string id = 1;
    google.protobuf.Timestamp timestamp = 2;
    string level = 3;
    string service = 4;
    string component = 5;
    string message = 6;
    string trace_id = 7;
    string span_id = 8;
    map<string, string> metadata = 9;
}

message EmitLogRequest {
    LogEntry entry = 1;
}

message EmitLogResponse {
    bool success = 1;
    string id = 2;
}

message StreamLogsRequest {
    repeated string services = 1;
    repeated string levels = 2;
}
